services:
  postgres-test:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: vo
      POSTGRES_PASSWORD: vo
      POSTGRES_DB: postgres
    ports:
      - "127.0.0.1:55432:5432"
    tmpfs:
      - /var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U vo"]
      interval: 2s
      timeout: 2s
      retries: 30
